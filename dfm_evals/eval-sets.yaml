sets:
  agentic:
    description: Agentic suite
    tasks:
      - name: inspect_evals/agentharm
        args:
          - -T
          - refusal_judge={{judge_model}}
          - -T
          - semantic_judge={{judge_model}}
      - name: inspect_evals/agentharm_benign
        args:
          - -T
          - refusal_judge={{judge_model}}
          - -T
          - semantic_judge={{judge_model}}
      - name: inspect_evals/agentdojo
        args:
          - -T
          - with_sandbox_tasks=no
          - -T
          - workspace=banking
    args:
      - --model
      - "{{target_model}}"
      - --limit
      - "25"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
  fundamentals:
    description: Broad inspect_evals fundamentals set
    tasks:
      - inspect_evals/gsm8k
      - inspect_evals/ifeval
      - ifeval-da
      - inspect_evals/truthfulqa
      - name: generative-talemaader
        args:
          - -T
          - judge_model={{judge_model}}
      - danish-citizen-tests
      - dala
      - gec_dala
      - wmt24pp-en-da
      - multi_wiki_qa
      - name: inspect_evals/bfcl
        args:
          - --message-limit
          - "24"
      - name: ruler
        args:
          - -T
          - variant=qa_1
          - -T
          - num_samples=16
          - -T
          - max_seq_length=8192
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - completion_tokens=2048
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=qa_2
          - -T
          - num_samples=16
          - -T
          - max_seq_length=32768
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - completion_tokens=4096
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=16
          - -T
          - max_seq_length=8192
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - completion_tokens=2048
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=16
          - -T
          - max_seq_length=32768
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - completion_tokens=4096
          - -T
          - context_buffer_tokens=256
    args:
      - --model
      - "{{target_model}}"
      - --limit
      - "250"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
  final_all:
    description: Final combined benchmark suite for ~8B instruct models; English, code, and OpenThoughts-TBLite with no suite-level sample limit
    tasks:
      - inspect_evals/gsm8k
      - inspect_evals/ifeval
      - inspect_evals/truthfulqa
      - inspect_evals/mmlu_0_shot
      - inspect_evals/mmlu_pro
      - inspect_evals/arc_easy
      - inspect_evals/arc_challenge
      - inspect_evals/hellaswag
      - name: ruler
        args:
          - -T
          - variant=qa_2
          - -T
          - max_seq_length=32768
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - completion_tokens=4096
          - -T
          - context_buffer_tokens=256
      - name: inspect_evals/bfcl
        args:
          - --message-limit
          - "24"
      - name: inspect_evals/humaneval
        args:
          - -T
          - sandbox=modal
      - name: inspect_evals/mbpp
        args:
          - --sandbox
          - daytona
      - name: inspect_harbor/openthoughts_tblite
        args:
          - -T
          - sandbox_env_name=modal
          - --no-fail-on-error
          - --continue-on-fail
          - --message-limit
          - "100"
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"
  final_english_core:
    description: Final benchmark English/general tasks; no suite-level sample limit
    tasks:
      - inspect_evals/gsm8k
      - inspect_evals/ifeval
      - inspect_evals/truthfulqa
      - inspect_evals/mmlu_0_shot
      - inspect_evals/mmlu_pro
      - inspect_evals/arc_easy
      - inspect_evals/arc_challenge
      - inspect_evals/hellaswag
      - name: inspect_evals/bfcl
        args:
          - --message-limit
          - "24"
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"
  final_code_8b:
    description: Final benchmark code suite for ~8B instruct models; sandbox-scored and no suite-level sample limit
    tasks:
      - name: inspect_evals/humaneval
        args:
          - -T
          - sandbox=modal
      - name: inspect_evals/mbpp
        args:
          - --sandbox
          - daytona
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"
  mbpp_daytona:
    description: Upstream Inspect MBPP with Daytona sandbox execution
    tasks:
      - name: inspect_evals/mbpp
        args:
          - --sandbox
          - daytona
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"
  final_openthoughts_tblite:
    description: Final benchmark inspect_harbor OpenThoughts-TBLite; modal sandbox and no suite-level sample limit
    tasks:
      - name: inspect_harbor/openthoughts_tblite
        args:
          - -T
          - sandbox_env_name=modal
    args:
      - --model
      - "{{target_model}}"
      - --no-fail-on-error
      - --continue-on-fail
      - --message-limit
      - "100"
      - --temperature
      - "0"
  bfcl_only:
    description: BFCL-only rerun suite using the upstream inspect_evals task
    tasks:
      - name: inspect_evals/bfcl
        args:
          - --message-limit
          - "24"
    args:
      - --model
      - "{{target_model}}"
      - --limit
      - "250"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
  wmt24pp_en_da:
    description: WMT24++ English-to-Danish translation task
    tasks:
      - wmt24pp-en-da
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"
  ruler_only:
    description: RULER-only suite for long-context spot checks and table refreshes
    tasks:
      - name: ruler
        args:
          - -T
          - variant=qa_1
          - -T
          - num_samples=16
          - -T
          - max_seq_length=8192
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - completion_tokens=2048
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=qa_2
          - -T
          - num_samples=16
          - -T
          - max_seq_length=32768
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - completion_tokens=4096
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=16
          - -T
          - max_seq_length=8192
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - completion_tokens=2048
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=16
          - -T
          - max_seq_length=32768
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - completion_tokens=4096
          - -T
          - context_buffer_tokens=256
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"
  openthoughts_tblite:
    description: inspect_harbor OpenThoughts-TBLite suite (requires inspect-harbor; sample failures are logged without aborting the full eval)
    tasks:
      - name: inspect_harbor/openthoughts_tblite
        args:
          - -T
          - sandbox_env_name=modal
    args:
      - --model
      - "{{target_model}}"
      - --no-fail-on-error
      - --continue-on-fail
      - --message-limit
      - "100"
      - --limit
      - "250"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
  ruler_smoke:
    description: Minimal RULER smoke suite for long-context synthetic retrieval and tracing
    tasks:
      - name: ruler
        args:
          - -T
          - variant=niah_single_1
          - -T
          - num_samples=4
          - -T
          - max_seq_length=4096
          - -T
          - tokenizer_backend=hf
          - -T
          - tokenizer_model=google/gemma-3-4b-it
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=4
          - -T
          - max_seq_length=4096
          - -T
          - tokenizer_backend=hf
          - -T
          - tokenizer_model=google/gemma-3-4b-it
    args:
      - --model
      - "{{target_model}}"
      - --limit
      - "2"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
